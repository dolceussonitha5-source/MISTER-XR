<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MISTER XR — Pairing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      min-height: 100vh;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;

      background:
        radial-gradient(circle at 20% 20%, rgba(0, 255, 255, .20), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(140, 0, 255, .25), transparent 30%),
        linear-gradient(135deg, #02030a, #070014, #00151c);
    }

    /* RGB BACKGROUND */
    body::before {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: linear-gradient(45deg, #00ffff, #7b00ff, #ff00cc);
      filter: blur(130px);
      opacity: .18;
      animation: moveGlow 8s infinite alternate ease-in-out;
      z-index: -1;
    }

    @keyframes moveGlow {
      from {
        transform: translate(-150px, -100px);
      }
      to {
        transform: translate(150px, 100px);
      }
    }

    .container {
      width: 100%;
      max-width: 430px;
      position: relative;
    }

    .card {
      padding: 30px 24px;
      border-radius: 30px;

      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        0 0 35px rgba(0,255,255,.08);

      text-align: center;
      animation: cardIn 1s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(35px) scale(.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* BOT IMAGE */
    .bot-image {
      width: 145px;
      height: 145px;
      margin: 0 auto 18px;

      border-radius: 50%;
      padding: 4px;

      background: linear-gradient(
        135deg,
        #00ffff,
        #7b00ff,
        #ff00cc,
        #00ffff
      );

      background-size: 300% 300%;
      animation: rgbBorder 4s linear infinite;
    }

    @keyframes rgbBorder {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .bot-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      border: 4px solid #05050b;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 7px 13px;
      margin-bottom: 15px;

      border-radius: 50px;
      background: rgba(0,255,150,.10);
      border: 1px solid rgba(0,255,150,.25);

      color: #72ffb7;
      font-size: 12px;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 12px #00ff88;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      50% {
        opacity: .35;
        transform: scale(.7);
      }
    }

    h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 1px;

      background: linear-gradient(
        90deg,
        #00ffff,
        #ffffff,
        #a66cff,
        #00ffff
      );

      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      animation: textRGB 4s linear infinite;
    }

    @keyframes textRGB {
      to {
        background-position: 300% center;
      }
    }

    .subtitle {
      margin-top: 7px;
      color: rgba(255,255,255,.65);
      font-size: 13px;
      line-height: 1.6;
    }

    .line {
      width: 80px;
      height: 3px;
      margin: 18px auto;
      border-radius: 20px;

      background: linear-gradient(
        90deg,
        #00ffff,
        #7b00ff,
        #ff00cc
      );

      box-shadow: 0 0 15px rgba(0,255,255,.5);
    }

    .form {
      text-align: left;
      margin-top: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,.85);
    }

    .input-box {
      display: flex;
      align-items: center;

      border-radius: 16px;
      overflow: hidden;

      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.13);

      transition: .3s;
    }

    .input-box:focus-within {
      border-color: #00ffff;
      box-shadow: 0 0 20px rgba(0,255,255,.12);
    }

    .prefix {
      padding: 14px;
      color: #00ffff;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px 12px 15px 0;

      background: transparent;
      border: none;
      outline: none;

      color: white;
      font-size: 14px;
    }

    input::placeholder {
      color: rgba(255,255,255,.35);
    }

    .pair-btn {
      width: 100%;
      margin-top: 16px;
      padding: 15px;

      border: none;
      border-radius: 16px;

      color: white;
      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      background: linear-gradient(
        90deg,
        #00aaff,
        #7b00ff,
        #ff00bb
      );

      background-size: 200% auto;

      box-shadow: 0 10px 30px rgba(100,0,255,.25);

      transition: .3s;
    }

    .pair-btn:hover {
      transform: translateY(-2px);
      background-position: right center;
      box-shadow: 0 12px 35px rgba(0,255,255,.20);
    }

    .pair-btn:active {
      transform: scale(.97);
    }

    .result {
      margin-top: 18px;
      padding: 18px 12px;

      border-radius: 16px;

      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.10);

      min-height: 55px;

      color: rgba(255,255,255,.75);
      font-size: 13px;
      word-break: break-word;
    }

    .code {
      display: block;
      margin-top: 7px;

      font-size: 28px;
      letter-spacing: 5px;
      font-weight: 800;

      color: #00ffff;
      text-shadow: 0 0 20px rgba(0,255,255,.7);
    }

    .info {
      margin-top: 20px;
      padding: 13px;

      border-radius: 14px;

      background: rgba(0,255,255,.05);
      border: 1px solid rgba(0,255,255,.10);

      color: rgba(255,255,255,.55);
      font-size: 11px;
      line-height: 1.6;
    }

    .footer {
      margin-top: 22px;
      color: rgba(255,255,255,.35);
      font-size: 11px;
    }

    .footer strong {
      color: rgba(255,255,255,.7);
    }

    @media (max-width: 420px) {
      .card {
        padding: 26px 18px;
      }

      h1 {
        font-size: 30px;
      }

      .bot-image {
        width: 125px;
        height: 125px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <!-- BOT PHOTO -->
      <div class="bot-image">
        <img
          src="IMG-20260919-WA0001.jpg"
          alt="MISTER XR"
        >
      </div>

      <div class="status">
        <span class="status-dot"></span>
        MISTER XR ONLINE
      </div>

      <h1>MISTER XR</h1>

      <p class="subtitle">
        Konekte WhatsApp ou ak MISTER XR
        atravè yon Pairing Code.
      </p>

      <div class="line"></div>

      <div class="form">

        <label for="phone">
          📱 Nimewo WhatsApp
        </label>

        <div class="input-box">

          <span class="prefix">+</span>

          <input
            id="phone"
            type="tel"
            inputmode="numeric"
            placeholder="509XXXXXXXX"
            autocomplete="tel"
          >

        </div>

        <button
          class="pair-btn"
          onclick="getPairCode()"
          id="pairButton"
        >
          🔐 GET PAIRING CODE
        </button>

      </div>

      <div class="result" id="result">
        Pairing code la ap parèt isit la.
      </div>

      <div class="info">
        💡 Mete kòd peyi a ansanm ak nimewo a.
        <br>
        Egzanp pou Ayiti: <strong>509XXXXXXXX</strong>
      </div>

      <div class="footer">
        Powered by <strong>MISTER XR BOT</strong>
      </div>

    </div>

  </div>

  <script>
    async function getPairCode() {

      const input = document.getElementById("phone");
      const result = document.getElementById("result");
      const button = document.getElementById("pairButton");

      let number = input.value.trim();

      number = number.replace(/\D/g, "");

      if (!number) {
        result.innerHTML = "❌ Tanpri mete nimewo WhatsApp la.";
        return;
      }

      if (number.length < 8) {
        result.innerHTML = "❌ Nimewo a sanble twò kout.";
        return;
      }

      button.disabled = true;
      button.innerText = "⏳ GENERATING...";

      result.innerHTML =
        "⏳ M ap prepare pairing code la...";

      try {

        const response = await fetch("/pair", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            number: number
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {

          result.innerHTML =
            "❌ " +
            (data.message ||
            "Pairing code la pa disponib.");

          button.disabled = false;
          button.innerText = "🔐 GET PAIRING CODE";

          return;
        }

        result.innerHTML = `
          <div>✅ PAIRING CODE</div>
          <span class="code">${data.code}</span>
          <div style="margin-top:8px;">
            Antre kòd sa a nan WhatsApp.
          </div>
        `;

        button.innerText = "✅ CODE GENERATED";

      } catch (error) {

        console.error(error);

        result.innerHTML =
          "❌ Server MISTER XR la pa reponn.";

        button.disabled = false;
        button.innerText = "🔐 GET PAIRING CODE";
      }
    }
  </script>

</body>
</html>
